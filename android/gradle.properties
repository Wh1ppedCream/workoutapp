org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m
# Windows checkouts and the Pub cache can live on different drives. Kotlin's
# incremental path cache cannot relativize those sources; retain Gradle task reuse.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true
# Locked native plugins still apply the legacy Kotlin Android plugin.
# Revisit both compatibility flags together when all plugins support the new DSL.
android.builtInKotlin=false
android.newDsl=false
