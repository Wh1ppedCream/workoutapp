name: Production Android release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-android-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.29.3

jobs:
  app-bundle:
    name: Signed production app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Require production secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required production environment secret: ${name}"
              exit 1
            fi
          done

      - name: Restore production signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/production-release-key.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=production-release-key.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Normalize generated localization formatting
        run: dart format lib/l10n/generated

      - name: Verify generated localization sources are committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- lib/l10n/generated)" ]]; then
            echo "::error::Localization output is stale. Run 'flutter gen-l10n' and commit the generated files."
            exit 1
          fi

      - name: Analyze source and tests
        run: dart analyze lib test integration_test test_driver

      - name: Analyze content-pipeline tools
        run: >-
          dart analyze
          tools/content_environment_check.dart
          tools/content_pipeline.dart
          tools/shared_media_pipeline.dart

      - name: Validate locked production content environment
        run: >-
          dart run tools/content_environment_check.dart
          --source assets/content/content_environments.json
          --target production
          --locked

      - name: Install catalog-builder dependencies
        working-directory: tools/catalog_builder
        run: dart pub get

      - name: Analyze catalog-builder tools
        working-directory: tools/catalog_builder
        run: dart analyze bin tool

      - name: Verify locked production build policy
        run: >-
          flutter test
          test/services/content_environment_compile_time_test.dart
          --dart-define=TONOS_CONTENT_ENVIRONMENT=production
          --dart-define=TONOS_CONTENT_ALLOW_OVERRIDES=false
          --dart-define=TONOS_EXPECTED_CONTENT_ENVIRONMENT=production
          --dart-define=TONOS_EXPECTED_CONTENT_OVERRIDES=false

      - name: Run unit and widget tests
        run: flutter test

      - name: Build signed production APK
        run: >-
          flutter build apk --release
          --dart-define=TONOS_CONTENT_ENVIRONMENT=production
          --dart-define=TONOS_CONTENT_ALLOW_OVERRIDES=false
          --dart-define=TONOS_ENABLE_EXPERIMENTAL_TABS=false

      - name: Build signed production app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=TONOS_CONTENT_ENVIRONMENT=production
          --dart-define=TONOS_CONTENT_ALLOW_OVERRIDES=false
          --dart-define=TONOS_ENABLE_EXPERIMENTAL_TABS=false

      - name: Upload production APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonos-production-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload production app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonos-production-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
