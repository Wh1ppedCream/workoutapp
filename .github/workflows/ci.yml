name: Flutter CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "feature/**"
      - "fix/**"
      - "updates/**"
      - "dependency/**"
      - "chore/**"
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.29.3

jobs:
  quality:
    name: Localization, analyzer, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization sources
        run: flutter gen-l10n

      - name: Normalize generated localization formatting
        run: dart format lib/l10n/generated

      - name: Verify generated localization sources are committed
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- lib/l10n/generated)" ]]; then
            git status --short -- lib/l10n/generated
            git diff -- lib/l10n/generated
            echo "::error::Localization output is stale. Run 'flutter gen-l10n' and commit the generated files."
            exit 1
          fi

      - name: Analyze source and tests
        run: dart analyze lib test integration_test test_driver

      - name: Analyze content-pipeline tools
        run: >-
          dart analyze
          tools/content_environment_check.dart
          tools/content_pipeline.dart
          tools/shared_media_pipeline.dart

      - name: Validate development content environment
        run: >-
          dart run tools/content_environment_check.dart
          --source assets/content/content_environments.json
          --target development

      - name: Install catalog-builder dependencies
        working-directory: tools/catalog_builder
        run: dart pub get

      - name: Analyze catalog-builder tools
        working-directory: tools/catalog_builder
        run: dart analyze bin tool

      - name: Validate catalog and media fixtures
        run: >-
          flutter test
          test/catalog_contract_test.dart
          test/tooling_fixture_contract_test.dart

      - name: Verify locked development build policy
        run: >-
          flutter test
          test/services/content_environment_compile_time_test.dart
          --dart-define=TONOS_CONTENT_ENVIRONMENT=development
          --dart-define=TONOS_CONTENT_ALLOW_OVERRIDES=false
          --dart-define=TONOS_EXPECTED_CONTENT_ENVIRONMENT=development
          --dart-define=TONOS_EXPECTED_CONTENT_OVERRIDES=false

      - name: Run unit and widget tests
        run: flutter test

      - name: Run diagnostics relay schema tests
        run: node --test services/diagnostics_relay/test/*.test.mjs

  release-apk:
    name: Release APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create disposable CI signing key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-release-key.jks \
            -storepass tonos-ci \
            -alias tonos-ci \
            -keypass tonos-ci \
            -dname "CN=Tonos CI, OU=CI, O=Tonos, L=Toronto, ST=Ontario, C=CA" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1

          cat > android/key.properties <<'EOF'
          storePassword=tonos-ci
          keyPassword=tonos-ci
          keyAlias=tonos-ci
          storeFile=ci-release-key.jks
          EOF

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=TONOS_CONTENT_ENVIRONMENT=development
          --dart-define=TONOS_CONTENT_ALLOW_OVERRIDES=false
          --dart-define=TONOS_ENABLE_EXPERIMENTAL_TABS=false

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tonos-release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
